apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-customer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-customer
  template:
    metadata:
      labels:
        app: ms-customer
    spec:
      containers:
      - name: ms-customer
        image: oussama132/ms-customer-app:1.0  # Use the Docker Hub image
        imagePullPolicy: Always  # Always pull the latest version of the image
        ports:
        - containerPort: 8085  # Expose the application port
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "default"  # Set the active Spring profile (if needed)
